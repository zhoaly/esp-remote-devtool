name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r server/requirements-dev.txt
      - run: ruff check server/app server/tests_py server/migrations local-agent/src local-agent/tests
      - run: pytest -q server/tests_py
        env:
          PYTHONPATH: server
      - name: JavaScript tests
        run: |
          node server/tests/test_common_custom_select.js server/app/static/js/common.js server/app/static/css/common.css
          node server/tests/test_lvgl_preview_layout.js server/app/static/js/lvgl-preview.js
          node server/tests/test_lvgl_preview_lifecycle.js server/app/static/js/lvgl-preview.js
          node server/tests/test_lvgl_preview_markup.js server/app/static/pages/lvgl-preview.html server/app/static/css/common.css
          node server/tests/test_lvgl_preview_mock_bridge.js server/app/static/js/lvgl-preview.js
          node server/tests/test_v2_client_contract.js server/app/static/js/api.js server/app/static/js/build.js server/app/static/js/jobs.js server/app/static/js/lvgl-jobs.js
          find server/app/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Bash syntax
        run: find server local-agent -name '*.sh' -type f -print0 | xargs -0 -n1 bash -n

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r local-agent/requirements.txt
      - run: python -m unittest discover -s local-agent/tests -v
        env:
          PYTHONPATH: local-agent/src
