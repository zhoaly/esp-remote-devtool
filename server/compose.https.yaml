name: esp-remote-https

services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: esp-remote-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ESP_PUBLIC_HOST: ${ESP_PUBLIC_HOST:-zlyhub.top}
      ESP_CADDY_UPSTREAM: ${ESP_CADDY_UPSTREAM:-host.docker.internal:8000}
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
